name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Decode keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > key.jks

    - name: Build with Gradle
      run: |
        if [ -f "key.jks" ] && [ -n "$KEY_ANDROID" ]; then
          ./gradlew assembleRelease --no-daemon
        else
          echo "============================================"
          echo "WARNING: Keystore not configured properly!"
          echo "KEY_ANDROID is: ${KEY_ANDROID:-NOT SET}"
          echo "key.jks exists: $(test -f key.jks && echo YES || echo NO)"
          echo "============================================"
          echo "Falling back to debug build without signing..."
          ./gradlew assembleDebug --no-daemon
        fi
      env:
        KEY_ANDROID: ${{ secrets.KEY_ANDROID }}
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release.apk
        path: app/build/outputs/apk/release/*.apk
